<!DOCTYPE html>
<html>
<head>
<title>SmartAI - ChatGPT Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; background:#212121; color:white; margin:0; display:flex; flex-direction:column; height:100vh;}
.header{padding:15px; text-align:center; border-bottom:1px solid #333;}
.chat{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column;}
.msg{margin:10px 0; padding:12px; border-radius:10px; max-width:80%; word-wrap:break-word;}
.user{background:#2f2f2f; align-self:flex-end; margin-left:auto;}
.bot{background:#444; align-self:flex-start;}
.input-area{display:flex; padding:15px; background:#2f2f2f; position:sticky; bottom:0;}
input{flex:1; padding:12px; border-radius:20px; border:none; outline:none;}
button{margin-left:10px; padding:12px 20px; border-radius:20px; border:none; background:#fff; cursor:pointer; font-weight:bold;}
a{color:#10a37f; text-decoration:none; font-weight:bold;}
</style>
</head>
<body>
<div class="header">
<h2>SmartAI 🤖</h2>
<p>Server Connected | <a href="https://SmartAILabs.com" target="_blank">Visit SmartAILabs.com</a></p>
</div>
<div class="chat" id="chat">
<div class="msg bot">Hello! Main SmartAI hu. SmartAILabs ke baare mein puchho!</div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="Message SmartAI..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
let input=document.getElementById("userInput");
let chat=document.getElementById("chat");
if(!input.value.trim())return;
let msg=input.value;
chat.innerHTML+=`<div class="msg user">${msg}</div>`;
input.value='';
chat.scrollTop=chat.scrollHeight;
try{
let res=await fetch('/api/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:msg})
});
let data=await res.json();
chat.innerHTML+=`<div class="msg bot">${data.reply || data.error || 'Error'}</div>`;
}catch(e){
chat.innerHTML+=`<div class="msg bot">Error: Server se connect nahi ho paaya</div>`;
}
chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
